<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>DealPilot | AI Assistant for Real Estate</title>
<meta name="description" content="DealPilot — the done-with-you AI assistant that works your leads, CMAs, documents, scheduling, and MLS from one dashboard."/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2317b08a'/%3E%3Cstop offset='1' stop-color='%230e7a63'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M18 46 L30 18 L40 34 L46 24' stroke='%23fff' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"/>
<style>
/* ================================================================
   DESIGN TOKENS — teal/slate system (Stop and Automate)
   ================================================================ */
:root{
  --bg: hsl(215 25% 4.5%);
  --bg-2: hsl(215 22% 7%);
  --bg-3: hsl(215 19% 10%);
  --elev: hsl(215 18% 12%);
  --line: hsl(215 16% 13.5%);
  --line-2: hsl(215 14% 18%);
  --t1: hsl(215 30% 95%);
  --t2: hsl(215 14% 70%);
  --t3: hsl(215 10% 50%);
  --t4: hsl(215 10% 38%);
  --accent: hsl(163 66% 43%);
  --accent-strong: hsl(160 70% 36%);
  --accent-fg: hsl(170 30% 5%);
  --accent-soft: hsl(163 60% 43% / .13);
  --accent-glow: hsl(163 60% 43% / .30);
  --good: hsl(152 62% 42%);
  --good-soft: hsl(152 62% 42% / .14);
  --warn: hsl(38 92% 55%);
  --warn-soft: hsl(38 92% 55% / .13);
  --info: hsl(200 90% 60%);
  --info-soft: hsl(200 90% 60% / .12);
  --bad: hsl(0 72% 60%);
  --bad-soft: hsl(0 72% 60% / .12);
  --r: 10px;
  --r-lg: 14px;
  --shadow-pop: 0 0 0 1px var(--line), 0 24px 70px -24px rgba(0,0,0,.55);
  --shadow-card: 0 0 0 1px var(--line), 0 10px 30px -14px rgba(0,0,0,.5);
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--t1);
  font-family:var(--font); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
::selection{background:var(--accent-glow); color:var(--t1)}
button{font-family:inherit; cursor:pointer; border:0; background:none; color:inherit}
input,select,textarea{font-family:inherit; color:inherit}
a{color:inherit; text-decoration:none}
::-webkit-scrollbar{width:9px; height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:8px; border:2px solid transparent; background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:hsl(215 12% 26%); border:2px solid transparent; background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent; width:0}

/* ---------- icon ---------- */
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ================================================================
   APP LAYOUT
   ================================================================ */
#app{display:flex; height:100vh; width:100vw; overflow:hidden}
.side{
  width:268px; flex:none; display:flex; flex-direction:column;
  background:var(--bg-2); border-right:1px solid var(--line);
  overflow:hidden; z-index:30;
}
.main{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; background:var(--bg)}
.artpanel{
  width:400px; flex:none; display:none; flex-direction:column; overflow:hidden;
  background:var(--bg-2); border-left:1px solid var(--line);
}
.artpanel.open{display:flex}
.artpanel.w-lg{width:520px}
.artpanel.anim{animation:slidein .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{opacity:0; transform:translateX(18px)}to{opacity:1; transform:none}}
@media (max-width:1100px){ .side{display:none} }
@media (max-width:900px){ .artpanel.w-lg{width:400px} }

/* ---------- sidebar ---------- */
.side-brand{display:flex; align-items:center; gap:10px; padding:14px 14px 10px}
.logo-stamp{
  width:36px; height:36px; flex:none; border-radius:10px;
  background:linear-gradient(135deg, hsl(163 70% 46%), hsl(190 65% 34%));
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 16px -4px var(--accent-glow), inset 0 0 0 1px hsl(163 50% 55% / .35);
}
.logo-stamp svg{width:20px;height:20px}
.side-brand b{font-size:14.5px; letter-spacing:-.2px; display:block; line-height:1.15}
.side-brand small{color:var(--t3); font-size:10.5px; letter-spacing:.4px; text-transform:uppercase; font-weight:600}
.newchat-btn{
  margin:8px 12px; display:flex; align-items:center; justify-content:center; gap:8px;
  padding:9px 12px; border-radius:var(--r);
  background:var(--accent); color:var(--accent-fg); font-weight:650; font-size:13px;
  box-shadow:0 6px 20px -6px var(--accent-glow), inset 0 1px 0 hsl(0 0% 100% / .18);
  transition:filter .15s;
}
.newchat-btn:hover{filter:brightness(1.08)}
.conv-search{display:flex; align-items:center; gap:8px; margin:2px 12px 8px; padding:7px 10px; border-radius:9px; background:var(--bg-3); border:1px solid var(--line); color:var(--t3)}
.conv-search input{background:none; border:0; outline:0; flex:1; font-size:12.5px; color:var(--t1)}
.conv-search input::placeholder{color:var(--t4)}
.side-scroll{flex:1; overflow-y:auto; padding:2px 8px 8px}
.side-label{padding:10px 8px 5px; font-size:10px; font-weight:700; letter-spacing:.9px; text-transform:uppercase; color:var(--t4)}
.conv-item{
  width:100%; text-align:left; display:flex; flex-direction:column; gap:1px;
  padding:7px 9px; border-radius:9px; color:var(--t2); transition:background .12s; margin-bottom:1px;
}
.conv-item:hover{background:var(--bg-3)}
.conv-item.active{background:var(--elev); color:var(--t1); box-shadow:inset 0 0 0 1px var(--line-2)}
.conv-item .t{font-size:12.8px; font-weight:560; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px}
.conv-item .s{font-size:10.5px; color:var(--t4); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:5px}
.conv-item .dot{width:5px; height:5px; flex:none; border-radius:50%; background:var(--good); box-shadow:0 0 0 3px var(--good-soft)}
.side-nav{padding:10px 12px 12px; border-top:1px solid var(--line)}
.side-nav a{
  display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:9px;
  color:var(--t2); font-size:12.8px; font-weight:550; transition:background .12s, color .12s;
}
.side-nav a:hover{background:var(--bg-3); color:var(--t1)}
.side-nav a.active{background:var(--elev); color:var(--t1); box-shadow:inset 0 0 0 1px var(--line-2)}
.side-nav .badge{
  margin-left:auto; min-width:17px; height:17px; padding:0 5px; border-radius:9px;
  background:var(--accent); color:var(--accent-fg); font-size:10.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.user-chip{display:flex; align-items:center; gap:9px; margin:0 12px 12px; padding:8px 9px; border-radius:10px; background:var(--bg-3); border:1px solid var(--line)}
.avatar{
  width:28px; height:28px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; color:var(--accent-fg);
  background:linear-gradient(135deg, hsl(163 45% 52%), hsl(190 45% 40%));
}
.user-chip b{font-size:12.5px; display:block; line-height:1.2}
.user-chip small{font-size:10px; color:var(--t3)}

/* ---------- generic ---------- */
.chip{
  display:inline-flex; align-items:center; gap:5px; padding:2.5px 9px; border-radius:99px;
  font-size:11px; font-weight:600; border:1px solid var(--line-2); color:var(--t2); background:var(--bg-3);
  white-space:nowrap;
}
.chip .ic{width:11.5px;height:11.5px}
.chip.good{background:var(--good-soft); border-color:hsl(152 62% 42% / .3); color:hsl(152 55% 62%)}
.chip.warn{background:var(--warn-soft); border-color:hsl(38 92% 55% / .3); color:hsl(38 85% 68%)}
.chip.info{background:var(--info-soft); border-color:hsl(200 90% 60% / .3); color:hsl(200 80% 72%)}
.chip.bad{background:var(--bad-soft); border-color:hsl(0 72% 60% / .3); color:hsl(0 65% 72%)}
.chip.acc{background:var(--accent-soft); border-color:hsl(163 60% 43% / .32); color:hsl(163 60% 60%)}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:8px 14px; border-radius:var(--r); font-size:12.8px; font-weight:640;
  background:var(--bg-3); color:var(--t1); border:1px solid var(--line-2);
  transition:background .12s, border-color .12s, filter .12s; white-space:nowrap;
}
.btn:hover{background:var(--elev)}
.btn.primary{background:var(--accent); color:var(--accent-fg); border-color:transparent; box-shadow:0 6px 18px -6px var(--accent-glow)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--t2)}
.btn.ghost:hover{background:var(--bg-3); color:var(--t1)}
.btn.danger{color:hsl(0 70% 70%); border-color:hsl(0 72% 60% / .3)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:5px 10px; font-size:11.5px; border-radius:8px}
.card{background:var(--bg-2); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-card)}
.field{width:100%; padding:9px 12px; border-radius:9px; background:var(--bg-3); border:1px solid var(--line-2); outline:0; font-size:13px}
.field:focus{border-color:hsl(163 50% 43% / .5); box-shadow:0 0 0 3px var(--accent-soft)}
.spin{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--t4);border-top-color:var(--accent);animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.pulse{animation:pl 2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.45}}
.caret{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 0.9s steps(1) infinite;border-radius:1px}
@keyframes blink{50%{opacity:0}}
.fadein{animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ================================================================
   CHAT
   ================================================================ */
.chat-wrap{flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative}
.chat-head{
  display:flex; align-items:center; gap:10px; padding:10px 16px;
  border-bottom:1px solid var(--line); background:var(--bg); flex:none;
}
.chat-head .title{font-size:14px; font-weight:640; letter-spacing:-.2px; display:flex; align-items:center; gap:9px; min-width:0}
.chat-head .title span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-soft);animation:pl 2.2s infinite}
.chat-scroll{flex:1; overflow-y:auto; padding:22px 0 26px; scroll-behavior:smooth}
.chat-inner{max-width:820px; margin:0 auto; padding:0 22px; display:flex; flex-direction:column; gap:18px}

.msg{display:flex; gap:11px; animation:fade .25s ease}
.msg.user{justify-content:flex-end}
.msg.user .bubble{
  max-width:78%; background:var(--accent); color:var(--accent-fg);
  padding:10px 14px; border-radius:16px 16px 4px 16px; font-weight:550; font-size:13.5px;
  box-shadow:0 8px 24px -10px var(--accent-glow);
}
.msg.ai{align-items:flex-start}
.msg.ai .ai-avatar{width:32px;height:32px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--bg-3);border:1px solid var(--line-2);box-shadow:0 3px 10px -4px rgba(0,0,0,.5)}
.msg.ai .ai-body{min-width:0; flex:1; display:flex; flex-direction:column; gap:9px}
.msg.ai .ai-name{font-size:11px; font-weight:700; color:var(--t3); letter-spacing:.3px}
.msg.ai .bubble{
  max-width:92%; background:var(--bg-2); border:1px solid var(--line);
  padding:11px 14px; border-radius:4px 16px 16px 16px; font-size:13.5px; color:var(--t1);
  white-space:pre-wrap; line-height:1.62;
}
.tool-stack{display:flex; flex-direction:column; gap:5px}
.tool-chip{
  width:100%; text-align:left; display:flex; align-items:center; gap:9px;
  padding:8px 11px; border-radius:9px; background:var(--bg-2); border:1px solid var(--line);
  color:var(--t2); transition:border-color .15s;
}
.tool-chip:hover{border-color:var(--line-2)}
.tool-chip .ic{width:13px;height:13px;color:var(--t3)}
.tool-chip .name{font-size:12.3px; font-weight:620; color:var(--t1)}
.tool-chip .sys{font-size:10px; font-family:var(--mono); color:var(--t4)}
.tool-chip .state{margin-left:auto; font-size:10.5px; color:var(--t4); display:flex; align-items:center; gap:6px}
.tool-chip.running{border-color:hsl(163 55% 43% / .4)}
.tool-chip .chev{transition:transform .15s}
.tool-chip.open .chev{transform:rotate(90deg)}
.tool-detail{
  padding:7px 11px 8px; border-radius:0 0 9px 9px; background:var(--bg-3);
  border:1px solid var(--line); border-top:0; margin-top:-5px; margin-bottom:0;
  font-size:11.8px; color:var(--t2); line-height:1.55;
}
.tool-detail b{color:hsl(163 55% 58%); font-weight:640}
.confirm-card{
  margin-top:2px; background:var(--bg-3); border:1px solid var(--line-2); border-radius:12px; padding:12px 13px;
  display:flex; flex-direction:column; gap:9px; animation:fade .25s both;
}
.confirm-card p{font-size:13px; color:var(--t1); font-weight:560}
.confirm-actions{display:flex; gap:8px; flex-wrap:wrap}
.artifact-link{
  display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:10px;
  background:var(--accent-soft); border:1px solid hsl(163 55% 43% / .35); color:hsl(163 55% 65%);
  font-size:12.8px; font-weight:640; transition:filter .15s;
}
.artifact-link:hover{filter:brightness(1.15)}

/* empty state */
.empty-state{flex:1; overflow-y:auto}
.empty-inner{max-width:760px; margin:0 auto; padding:44px 24px 30px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px}
.big-logo{
  width:74px; height:74px; border-radius:20px;
  background:linear-gradient(135deg, hsl(163 70% 46%), hsl(190 65% 34%));
  display:flex; align-items:center; justify-content:center; margin-bottom:6px;
  box-shadow:0 0 0 1px hsl(163 50% 60% / .3), 0 26px 80px -22px var(--accent-glow);
  animation:fade .5s ease;
}
.big-logo svg{width:40px;height:40px}
.empty-inner h1{font-size:26px; letter-spacing:-.5px; font-weight:740; line-height:1.25}
.empty-inner .sub{color:var(--t3); font-size:13.8px; max-width:520px; line-height:1.6}
.starter-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; margin-top:26px; text-align:left}
@media (max-width:860px){ .starter-grid{grid-template-columns:1fr} .empty-inner{padding-top:26px} }
.starter-card{
  text-align:left; padding:14px 15px; border-radius:14px; background:var(--bg-2);
  border:1px solid var(--line); transition:border-color .15s, transform .15s, box-shadow .15s;
  display:flex; flex-direction:column; gap:8px; animation:fade .4s both;
}
.starter-card:hover{border-color:hsl(163 50% 43% / .45); transform:translateY(-2px); box-shadow:0 14px 34px -18px var(--accent-glow)}
.starter-card .row{display:flex; align-items:center; gap:9px}
.starter-card .i-wrap{width:30px; height:30px; flex:none; border-radius:9px; background:var(--accent-soft); border:1px solid hsl(163 55% 43% / .3); display:flex; align-items:center; justify-content:center; color:hsl(163 55% 62%)}
.starter-card .i-wrap .ic{width:15px;height:15px}
.starter-card b{font-size:13.2px; font-weight:660; letter-spacing:-.2px}
.starter-card p{font-size:12px; color:var(--t3); line-height:1.55}
.starter-card .meta{font-size:10.5px; color:var(--t4); display:flex; align-items:center; gap:6px}
.composer-outer{flex:none; padding:0 22px 16px}
.composer-inner{max-width:820px; margin:0 auto}
.cmd-list{margin-bottom:7px; border:1px solid var(--line-2); border-radius:12px; overflow:hidden; background:var(--bg-2); box-shadow:var(--shadow-pop)}
.cmd-item{width:100%; text-align:left; display:flex; align-items:center; gap:10px; padding:9px 13px; font-size:12.8px; color:var(--t2)}
.cmd-item:hover{background:var(--bg-3); color:var(--t1)}
.cmd-item code{font-family:var(--mono); font-size:12px; color:hsl(163 55% 58%); background:var(--bg-3); padding:2px 7px; border-radius:6px; border:1px solid var(--line)}
.composer{
  display:flex; align-items:flex-end; gap:9px; padding:9px 10px 9px 14px;
  background:var(--bg-2); border:1px solid var(--line-2); border-radius:16px;
  box-shadow:var(--shadow-card); transition:border-color .15s, box-shadow .15s;
}
.composer:focus-within{border-color:hsl(163 50% 45% / .55); box-shadow:0 0 0 3px var(--accent-soft), var(--shadow-card)}
.composer textarea{
  flex:1; background:none; border:0; outline:0; resize:none; font-size:13.5px; color:var(--t1);
  line-height:1.5; min-height:22px; max-height:200px; padding:4px 0;
}
.composer textarea::placeholder{color:var(--t4)}
.icon-btn{
  width:34px; height:34px; flex:none; border-radius:10px; display:flex; align-items:center; justify-content:center;
  color:var(--t3); transition:background .12s, color .12s;
}
.icon-btn:hover{background:var(--bg-3); color:var(--t1)}
.icon-btn.send{background:var(--accent); color:var(--accent-fg); box-shadow:0 6px 18px -6px var(--accent-glow)}
.icon-btn.send:hover{filter:brightness(1.1)}
.icon-btn.send:disabled{background:var(--bg-3); color:var(--t4); box-shadow:none; cursor:default}
.composer-foot{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:8px; font-size:10.6px; color:var(--t4)}
.composer-foot .c{display:flex; align-items:center; gap:5px}
.composer-foot .c .ic{width:10.5px; height:10.5px}

/* ================================================================
   ARTIFACT PANEL
   ================================================================ */
.art-head{display:flex; align-items:center; gap:9px; padding:11px 14px; border-bottom:1px solid var(--line); flex:none}
.art-head .kind-badge{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);border:1px solid hsl(163 55% 43%/.3);display:flex;align-items:center;justify-content:center;color:hsl(163 55% 62%)}
.art-head .kind-badge .ic{width:13px;height:13px}
.art-head b{font-size:13px; font-weight:660; line-height:1.2; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.art-head small{font-size:10.5px; color:var(--t3); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.art-body{flex:1; overflow-y:auto; padding:16px}

/* CMA */
.cma{display:flex; flex-direction:column; gap:14px}
.cma-hero{position:relative; border-radius:12px; overflow:hidden; aspect-ratio:16/8.3; box-shadow:var(--shadow-pop)}
.cma-hero img{width:100%; height:100%; object-fit:cover; display:block}
.cma-hero .fold{position:absolute; inset:auto 8px 8px 8px; display:flex; justify-content:flex-end; gap:6px}
.cma-title{display:flex; flex-direction:column; gap:4px}
.cma-title h2{font-size:18px; letter-spacing:-.3px; line-height:1.3}
.cma-title .meta{font-size:11.5px; color:var(--t3); display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.fact-row{display:grid; grid-template-columns:repeat(4,1fr); gap:9px}
.fact{background:var(--bg-3); border:1px solid var(--line); border-radius:10px; padding:9px 10px; display:flex; flex-direction:column; gap:2px}
.fact small{font-size:9.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--t4); display:flex; align-items:center; gap:5px}
.fact small .ic{width:11px;height:11px}
.fact b{font-size:14.5px; font-weight:680}
.price-hero{background:linear-gradient(135deg, hsl(163 55% 20%), hsl(190 45% 12%)); border:1px solid hsl(163 50% 40%/.35); border-radius:13px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px}
.price-hero small{display:block; font-size:10px; letter-spacing:.8px; text-transform:uppercase; font-weight:700; color:hsl(163 45% 62%)}
.price-hero .big{font-size:27px; font-weight:760; letter-spacing:-.6px; color:var(--t1)}
.price-hero .rng{font-size:11.5px; color:var(--t2); margin-top:2px}
.cma-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
.cma-stats .s{background:var(--bg-3); border:1px solid var(--line); border-radius:10px; padding:9px 11px}
.cma-stats .s small{font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--t4)}
.cma-stats .s b{font-size:15px}
.cma-stats .s span{font-size:9.8px; color:var(--t3); display:block}
.bars{display:flex; align-items:flex-end; gap:7px; height:84px; padding:4px 2px 0}
.bars .b{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end}
.bars .fill{width:100%; background:linear-gradient(180deg, hsl(163 50% 45%), hsl(163 55% 30%)); border-radius:5px 5px 2px 2px; min-height:4px; box-shadow:0 2px 10px -3px var(--accent-glow)}
.bars .cap{font-size:9px; color:var(--t4)}
.bars .val{font-size:8.6px; color:var(--t3); font-family:var(--mono)}
.comp-row{display:flex; align-items:center; gap:10px; padding:8px; border-radius:11px; border:1px solid var(--line); background:var(--bg-2)}
.comp-row img{width:56px; height:42px; object-fit:cover; border-radius:8px; flex:none}
.comp-row .l1{font-size:12.3px; font-weight:620}
.comp-row .l2{font-size:10.6px; color:var(--t3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.comp-row .n{margin-left:auto; text-align:right; line-height:1.3}
.comp-row .n b{font-size:12.5px; font-weight:700}
.comp-row .n small{font-size:10px; color:var(--t3); display:block}
.cma-foot{margin-top:auto; position:sticky; bottom:-16px; padding:12px 0 4px; background:linear-gradient(180deg, transparent, var(--bg-2) 30%); display:flex; align-items:center; justify-content:space-between; gap:10px; border-top:1px solid var(--line)}
.cma-foot .for{font-size:11.5px; color:var(--t3)}
.cma-foot .for b{color:var(--t1); font-weight:640}

/* listings */
.l-grid-tools{display:flex; align-items:center; gap:8px; margin-bottom:11px}
.seg{display:inline-flex; background:var(--bg-3); border:1px solid var(--line-2); border-radius:9px; padding:2px}
.seg button{padding:4px 11px; border-radius:7px; font-size:11.5px; font-weight:620; color:var(--t3)}
.seg button.on{background:var(--accent); color:var(--accent-fg)}
.l-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media (max-width:1500px){ .l-grid{grid-template-columns:1fr 1fr} }
.l-card{border-radius:12px; overflow:hidden; border:1px solid var(--line); background:var(--bg-2); cursor:pointer; text-align:left; transition:transform .15s, border-color .15s, box-shadow .15s; position:relative}
.l-card.short{border-color:hsl(163 55% 43%/.55); box-shadow:0 0 0 1px hsl(163 55% 43%/.4)}
.l-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-pop)}
.l-img{position:relative; aspect-ratio:16/10; background:var(--bg-3)}
.l-img img{width:100%; height:100%; object-fit:cover; display:block}
.l-img .st{position:absolute; inset:8px 8px auto auto}
.l-img .heart{position:absolute; inset:auto 8px 8px auto; width:26px; height:26px; border-radius:50%; background:hsl(0 0% 0%/.45); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; color:#fff}
.l-img .heart.on{color:hsl(0 75% 68%)}
.l-img .heart.on .ic{fill:currentColor}
.l-price-fab{position:absolute; inset:auto 8px 8px auto}
.l-body{padding:9px 11px 11px; display:flex; flex-direction:column; gap:3px}
.l-body .pr{font-size:15px; font-weight:730; letter-spacing:-.2px}
.l-body .ad{font-size:11.8px; color:var(--t1); font-weight:570}
.l-body .cy{font-size:10.6px; color:var(--t3)}
.l-facts{display:flex; gap:10px; margin-top:5px; font-size:10.9px; color:var(--t2)}
.l-facts span{display:flex; align-items:center; gap:4px}
.l-facts .ic{width:11px;height:11px;color:var(--t4)}
.l-detail-back{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--t3); margin-bottom:10px}
.l-detail-back:hover{color:var(--t1)}
.ld-hero{position:relative; border-radius:12px; overflow:hidden; aspect-ratio:16/9; box-shadow:var(--shadow-pop)}
.ld-hero img{width:100%; height:100%; object-fit:cover}
.ld-gal{display:flex; gap:6px; margin-top:6px}
.ld-gal img{width:31%; aspect-ratio:16/10; object-fit:cover; border-radius:8px; border:1px solid var(--line)}
.ld-price{display:flex; align-items:baseline; gap:10px; margin:12px 0 4px}
.ld-price .v{font-size:26px; font-weight:760; letter-spacing:-.5px}
.ld-desc{font-size:12.6px; color:var(--t2); line-height:1.65}
.hl-chips{display:flex; flex-wrap:wrap; gap:6px; margin:11px 0}
.spec-grid{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:11px; overflow:hidden; margin-bottom:12px}
.spec-grid div{background:var(--bg-2); padding:8px 11px; display:flex; justify-content:space-between; font-size:11.8px}
.spec-grid small{color:var(--t4)}
.spec-grid b{font-weight:620}
.map-ph{height:120px; border-radius:11px; border:1px solid var(--line); background:
  linear-gradient(120deg, var(--bg-3) 25%, var(--elev) 25%, var(--elev) 50%, var(--bg-3) 50%, var(--bg-3) 75%, var(--elev) 75%);
  background-size:26px 26px; display:flex; align-items:center; justify-content:center; gap:8px; color:var(--t4); font-size:11px; font-weight:600}

/* document */
.doc-tabs{display:flex; gap:4px; margin-bottom:12px; border-bottom:1px solid var(--line); padding-bottom:10px}
.doc-tab{font-size:11.5px; font-weight:620; color:var(--t3); padding:5px 11px; border-radius:8px}
.doc-tab.on{color:var(--t1); background:var(--bg-3)}
.doc-status{display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap}
.doc-rev{display:flex; align-items:center; gap:7px; background:var(--good-soft); border:1px solid hsl(152 60% 42%/.3); color:hsl(152 55% 62%); border-radius:9px; padding:7px 11px; font-size:11.3px; margin-bottom:12px}
.paper{
  background:#faf7f2; color:#241d17; border-radius:4px 10px 10px 10px;
  padding:26px 26px; font-size:11.3px; line-height:1.8; box-shadow:0 -8px 40px -12px rgba(0,0,0,.5);
  font-family:Georgia, "Times New Roman", serif; min-height:470px; position:relative;
}
.paper h3{font-size:15px; text-align:center; margin-bottom:2px}
.paper .cen{text-align:center; font-size:10px; color:#6b5c4d; margin-bottom:14px}
.paper .cen2{text-align:center; font-size:10.6px; color:#6b5c4d; margin-top:18px}
.paper p{margin-bottom:8px}
.paper .fillmark{background:hsl(55 70% 86%); padding:0 4px; border-radius:2px; color:#20180f; font-weight:600}
.paper .sigline{display:flex; justify-content:space-between; gap:26px; margin-top:22px}
.paper .sg{flex:1}
.paper .sg .line{border-top:1px solid #4a3b2c; padding-top:3px; font-size:10px; color:#4a3b2c}
.paper .stamp{position:absolute; top:74px; right:22px; transform:rotate(8deg); border:2px solid hsl(152 55% 40%); color:hsl(152 50% 38%); font-weight:800; letter-spacing:2px; padding:6px 12px; border-radius:5px; font-size:11px; opacity:.8; font-family:var(--font)}
.doc-pager{display:flex; align-items:center; justify-content:space-between; margin-top:14px}
.doc-pager b{font-size:12px; color:var(--t2); font-weight:620}
.doc-foot{display:flex; gap:9px; margin-top:14px}

/* schedule */
.sch-chips{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px}
.slots{display:flex; gap:8px; margin-bottom:14px}
.slot-btn{flex:1; text-align:center; padding:9px 6px; border-radius:11px; border:1px solid var(--line-2); background:var(--bg-3); transition:all .13s; display:flex; flex-direction:column; gap:1px}
.slot-btn small{font-size:10px; color:var(--t4); font-weight:700}
.slot-btn b{font-size:13.5px}
.slot-btn.on{border-color:hsl(163 55% 43%/.6); background:var(--accent-soft); box-shadow:0 0 0 3px var(--accent-soft)}
.slot-btn.on b{color:hsl(163 50% 66%)}
.weekgrid{border:1px solid var(--line); border-radius:12px; overflow:hidden}
.wk-head{display:grid; grid-template-columns:44px repeat(5,1fr); border-bottom:1px solid var(--line); background:var(--bg-2)}
.wk-head div{padding:7px 4px; text-align:center; font-size:10px; font-weight:700; color:var(--t3); letter-spacing:.4px}
.wk-row{display:grid; grid-template-columns:44px repeat(5,1fr); border-bottom:1px solid var(--line); min-height:34px}
.wk-row:last-child{border-bottom:0}
.wk-row .hr{font-size:9px; color:var(--t4); padding:4px 6px; font-family:var(--mono); text-align:right}
.wk-cell{position:relative; border-left:1px solid var(--line); padding:0}
.wk-cell + .wk-cell{border-left:1px solid var(--line)}
.ev{position:absolute; inset:2px 3px; border-radius:6px; font-size:9.3px; font-weight:640; display:flex; align-items:center; padding:0 6px; overflow:hidden; white-space:nowrap}
.ev.busy{background:hsl(215 45% 28%); color:hsl(215 60% 88%); border:1px solid hsl(215 50% 38%/.4)}
.ev.prop{background:var(--accent-soft); color:hsl(163 55% 62%); border:1px dashed hsl(163 55% 50%/.5); cursor:pointer}
.ev.prop.on{background:var(--accent); color:var(--accent-fg); border-style:solid}
.outreach-row{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px}
.o-card{text-align:left; padding:10px 11px; border-radius:11px; border:1px solid var(--line-2); background:var(--bg-3); transition:all .13s; display:flex; flex-direction:column; gap:4px}
.o-card.on{border-color:hsl(163 55% 43%/.6); box-shadow:0 0 0 3px var(--accent-soft)}
.o-card .top{display:flex; align-items:center; gap:7px; font-size:12px; font-weight:660}
.o-card .top .ic{width:13px;height:13px;color:hsl(163 50% 58%)}
.o-card small{font-size:9.8px; color:var(--t3); line-height:1.45}
.preview-box{border:1px solid var(--line-2); border-radius:12px; background:var(--bg-2); padding:12px 13px; font-size:12px; color:var(--t2); line-height:1.6; display:flex; gap:10px}
.preview-box .ic{width:14px; height:14px; color:hsl(163 50% 58%); margin-top:2px}
.preview-box .hdrs{font-family:var(--mono); font-size:10.4px; color:var(--t3); margin-bottom:6px}
.preview-box .themeline{margin-top:8px; font-size:10.4px; color:var(--t4); display:flex; align-items:center; gap:6px}
.sch-sendrow{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:13px; padding-top:12px; border-top:1px solid var(--line)}
.sch-sendrow .note{font-size:10.5px; color:var(--t3); display:flex; align-items:center; gap:6px}

/* nurture */
.temp-row{display:flex; gap:8px; margin-bottom:12px}
.temp-pill{flex:1; border-radius:11px; border:1px solid var(--line); background:var(--bg-3); padding:8px 11px; display:flex; align-items:center; gap:8px; cursor:pointer; transition:all .13s}
.temp-pill.on{border-color:hsl(163 55% 43%/.55); box-shadow:0 0 0 3px var(--accent-soft)}
.temp-pill .dot{width:8px; height:8px; border-radius:50%}
.temp-pill small{font-size:10px; color:var(--t4); font-weight:700; letter-spacing:.5px; text-transform:uppercase}
.temp-pill b{font-size:12.5px}
.lead-row{width:100%; text-align:left; display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--bg-2); margin-bottom:6px; transition:all .12s}
.lead-row.on{border-color:hsl(163 55% 43%/.6); box-shadow:0 0 0 3px var(--accent-soft)}
.lead-row .init{width:28px; height:28px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#fff}
.lead-row .nm{font-size:12.4px; font-weight:640}
.lead-row .mm{font-size:10.4px; color:var(--t3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lead-row .score{margin-left:auto; font-size:10px; font-weight:700; padding:2px 7px; border-radius:99px}
.seq-table{border:1px solid var(--line); border-radius:12px; overflow:hidden}
.seq-row{display:grid; grid-template-columns:34px 92px 1fr; gap:8px; align-items:center; padding:7px 10px; border-bottom:1px solid var(--line); font-size:11.6px; background:var(--bg-2)}
.seq-row:last-child{border-bottom:0}
.seq-row:nth-child(odd){background:var(--bg-3)}
.seq-row .day{width:22px; height:22px; border-radius:7px; background:var(--accent-soft); color:hsl(163 50% 62%); font-weight:700; font-size:10.5px; display:flex; align-items:center; justify-content:center}
.seq-row .ch{display:flex; align-items:center; gap:5px; font-weight:640; color:var(--t1)}
.seq-row .ch .ic{width:11px; height:11px; color:var(--t3)}
.seq-row .li{color:var(--t2); font-size:11px; line-height:1.4}
.seq-note{font-size:10.6px; color:var(--t3); display:flex; align-items:center; gap:6px; margin-top:9px}
.queue-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:13px; padding:12px; border:1px solid hsl(163 50% 45%/.4); background:linear-gradient(135deg, hsl(163 40% 12%), var(--bg-3)); border-radius:12px}
.queue-row p{font-size:12.4px; font-weight:600; color:var(--t1)}

/* ================================================================
   PAGES (Tasks / Approvals / Agents / Settings)
   ================================================================ */
.page{flex:1; overflow-y:auto}
.page-in{max-width:860px; margin:0 auto; padding:26px 24px 60px}
.page-head{margin-bottom:20px}
.page-head h1{font-size:20px; font-weight:730; letter-spacing:-.4px; display:flex; align-items:center; gap:10px}
.page-head p{font-size:12.8px; color:var(--t3); margin-top:3px}
.bucket-lbl{font-size:10.5px; font-weight:740; letter-spacing:1px; text-transform:uppercase; color:var(--t4); margin:20px 0 9px; display:flex; align-items:center; gap:8px}
.bucket-lbl::after{content:""; height:1px; flex:1; background:var(--line)}
.task-card{width:100%; text-align:left; border:1px solid var(--line); background:var(--bg-2); border-radius:14px; padding:13px 15px; margin-bottom:9px; transition:border-color .15s, transform .12s; cursor:pointer}
.task-card:hover{border-color:hsl(163 50% 43%/.4); transform:translateY(-1px)}
.task-top{display:flex; align-items:center; gap:8px; margin-bottom:5px}
.task-top .due{font-size:10.3px; font-weight:640; color:var(--t4)}
.task-card h3{font-size:13.8px; font-weight:670; letter-spacing:-.2px; margin-bottom:3px}
.task-card p{font-size:12px; color:var(--t2); line-height:1.55}
.task-foot{display:flex; align-items:center; gap:8px; margin-top:9px; flex-wrap:wrap}
.src-chip{display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:640; color:var(--t3); border:1px solid var(--line-2); border-radius:99px; padding:2.5px 8px}
.src-chip .ic{width:10px; height:10px}
.task-cta{margin-left:auto; display:inline-flex; align-items:center; gap:6px; font-size:11.6px; font-weight:660; color:hsl(163 50% 60%); background:var(--accent-soft); border:1px solid hsl(163 50% 45%/.35); padding:5px 11px; border-radius:8px}
.apr-card{border:1px solid var(--line); border-radius:14px; background:var(--bg-2); margin-bottom:13px; overflow:hidden}
.apr-top{display:flex; align-items:flex-start; gap:11px; padding:14px 15px 0}
.apr-start{width:30px; height:30px; flex:none; border-radius:9px; display:flex; align-items:center; justify-content:center; background:var(--bg-3); border:1px solid var(--line-2); color:hsl(163 50% 58%)}
.apr-start .ic{width:14px; height:14px}
.apr-card h3{font-size:13.8px; font-weight:680; letter-spacing:-.2px; line-height:1.35}
.apr-card .sum{font-size:12.2px; color:var(--t2); line-height:1.55; margin-top:2px}
.apr-body{padding:11px 15px 15px; display:flex; flex-direction:column; gap:10px}
.apr-facts{display:flex; gap:8px; flex-wrap:wrap}
.policy{display:flex; gap:9px; align-items:flex-start; background:var(--warn-soft); border:1px solid hsl(38 92% 55%/.28); border-radius:10px; padding:9px 11px; font-size:11.4px; color:hsl(38 75% 70%)}
.policy .ic{width:13px; height:13px; margin-top:1px; flex:none}
.ev-lbl{font-size:9.8px; font-weight:740; letter-spacing:.8px; text-transform:uppercase; color:var(--t4); margin:2px 0 6px}
.ev-row{display:flex; align-items:flex-start; gap:9px; padding:7px 10px; border:1px solid var(--line); border-radius:10px; background:var(--bg-3); margin-bottom:6px}
.ev-row .ic{width:13px; height:13px; color:var(--t3); margin-top:2px}
.ev-row b{font-size:11px; font-weight:680; display:block; color:var(--t1)}
.ev-row span{font-size:11px; color:var(--t3); line-height:1.45}
.plan-lbl{font-size:9.8px; font-weight:740; letter-spacing:.8px; text-transform:uppercase; color:var(--t4); margin:4px 0 6px}
.plan-row{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--t2); padding:3px 0}
.plan-row .ic{width:12px; height:12px; color:hsl(163 50% 50%)}
.apr-actions{display:flex; gap:8px; margin-top:12px}
.apr-res-chip{display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:650; padding:3px 10px; border-radius:99px}
.agents-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:12px}
@media (max-width:760px){ .agents-grid{grid-template-columns:1fr} .fact-row{grid-template-columns:repeat(2,1fr)} .cma-stats{grid-template-columns:1fr 1fr} }
.ag-card{border:1px solid var(--line); background:var(--bg-2); border-radius:14px; padding:14px 15px; transition:border-color .15s}
.ag-card:hover{border-color:var(--line-2)}
.ag-top{display:flex; align-items:center; gap:10px; margin-bottom:9px}
.ag-av{width:34px; height:34px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, hsl(163 40% 24%), hsl(190 40% 18%)); border:1px solid hsl(163 40% 40%/.3); color:hsl(163 50% 60%)}
.ag-av .ic{width:15px; height:15px}
.ag-top h3{font-size:13.6px; font-weight:690; letter-spacing:-.2px}
.ag-top .role{font-size:10.6px; color:var(--t3)}
.ag-state{margin-left:auto; display:inline-flex; align-items:center; gap:6px; font-size:10.3px; font-weight:660; padding:3px 10px; border-radius:99px}
.ag-doing{display:flex; align-items:center; gap:7px; font-size:11.6px; color:var(--t2); background:var(--bg-3); border:1px solid var(--line); border-radius:9px; padding:7px 10px; margin-bottom:10px}
.ag-foot{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.ag-foot .model{font-size:9.8px; font-family:var(--mono); color:var(--t4); margin-left:auto}
.set-card{border:1px solid var(--line); background:var(--bg-2); border-radius:14px; padding:16px; margin-bottom:14px}
.set-card h3{font-size:13.5px; font-weight:690; margin-bottom:2px; letter-spacing:-.2px}
.set-card .sub{font-size:11.6px; color:var(--t3); margin-bottom:12px}
.set-row{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .ic-wrap{width:30px;height:30px;flex:none;border-radius:9px;background:var(--bg-3);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;color:var(--t2)}
.set-row .ic-wrap .ic{width:13.5px;height:13.5px}
.set-row b{font-size:12.6px; font-weight:640; display:block}
.set-row small{font-size:10.8px; color:var(--t3)}
.set-row .right{margin-left:auto; display:flex; align-items:center; gap:8px}
.switch{width:36px; height:21px; border-radius:99px; background:var(--line-2); position:relative; transition:background .15s; flex:none}
.switch.on{background:var(--accent)}
.switch i{position:absolute; top:2.5px; left:2.5px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .18s; font-style:normal}
.switch.on i{transform:translateX(15px)}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px}

/* toast */
#toasts{position:fixed; bottom:18px; right:18px; z-index:100; display:flex; flex-direction:column; gap:9px; pointer-events:none}
.toast{
  pointer-events:auto; min-width:280px; max-width:360px; display:flex; gap:10px; align-items:flex-start;
  background:var(--elev); border:1px solid var(--line-2); border-radius:12px; padding:11px 13px;
  box-shadow:var(--shadow-pop); animation:toastin .3s cubic-bezier(.2,.9,.3,1.2) both;
}
.toast.out{transition:all .3s; opacity:0; transform:translateY(8px)}
@keyframes toastin{from{opacity:0; transform:translateY(14px) scale(.97)}to{opacity:1; transform:none}}
.toast .ic{width:15px; height:15px; margin-top:1px; color:var(--accent)}
.toast b{font-size:12.4px; font-weight:660; display:block}
.toast small{font-size:11px; color:var(--t3); line-height:1.5; display:block; margin-top:1px}

/* palette */
#palette-back{position:fixed; inset:0; z-index:90; background:hsl(215 30% 2%/.65); backdrop-filter:blur(3px); display:flex; justify-content:center; align-items:flex-start; padding-top:15vh}
#palette{
  width:min(560px, 92vw); background:var(--bg-2); border:1px solid var(--line-2); border-radius:16px;
  box-shadow:var(--shadow-pop); overflow:hidden; animation:fade .18s ease both;
}
#palette input{width:100%; padding:15px 17px; background:none; border:0; outline:0; font-size:14.5px; border-bottom:1px solid var(--line)}
#palette .pl-list{max-height:330px; overflow-y:auto; padding:7px}
.pl-group{font-size:9.6px; font-weight:760; text-transform:uppercase; letter-spacing:1px; color:var(--t4); padding:8px 10px 4px}
.pl-item{width:100%; text-align:left; display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:9px; font-size:13px; color:var(--t2)}
.pl-item.sel{background:var(--accent-soft); color:var(--t1)}
.pl-item .ic{width:14px; height:14px; color:var(--t3)}
.pl-item small{margin-left:auto; font-size:10.3px; color:var(--t4)}
.invite-banner{display:flex; align-items:center; gap:10px; margin-top:20px; padding:10px 14px; border-radius:11px; border:1px dashed hsl(163 45% 45%/.4); background:var(--accent-soft); color:hsl(163 45% 66%); font-size:11.6px; line-height:1.5}
.invite-banner .ic{width:14px;height:14px;flex:none}
.hiddenfile{display:none}
kbd{font-family:var(--mono); font-size:9.6px; padding:1.5px 5px; border-radius:5px; background:var(--bg-3); border:1px solid var(--line-2); color:var(--t3)}

let playToken = 0;
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function mid(p){ return (p||"id")+"-"+Math.random().toString(36).slice(2,9); }
function ensureChat(id){
  if(!state.chats[id]) state.chats[id] = [];
  return state.chats[id];
}
async function streamInto(tok, msg, text, speed){
  msg.streaming = true; msg.text = "";
  const base = typeof text === "function" ? text() : text;
  for(let i=1; i<=base.length; i+=2){
    if(tok !== playToken) return false;
    msg.text = base.slice(0, i);
    renderChatOnly();
    await sleep(speed ?? 10);
  }
  if(tok !== playToken) return false;
  msg.text = base; msg.streaming = false;
  renderChatOnly();
  return true;
}
async function runScript(scriptId, convId){
  const script = SCRIPTS[scriptId];
  if(!script) return;
  const tok = ++playToken;
  state.played[scriptId] = true;
  const conv = state.conversations.find(c=>c.id===convId);
  const msgs = ensureChat(convId);
  for(const step of script.steps){
    if(tok !== playToken) return;
    if(step.delay) await sleep(step.delay);
    if(tok !== playToken) return;
    switch(step.type){
      case "user": {
        msgs.push({ id: mid("m"), role:"user", text: step.text, createdAt:Date.now() });
        renderChatOnly();
        break;
      }
      case "text": {
        const host = lastAssistant(msgs, true);
        await streamInto(tok, host.m, step.text, step.stream);
        break;
      }
      case "tool": {
        const host = lastAssistant(msgs, true);
        host.m.toolStack = host.m.toolStack || [];
        const call = { id: mid("tc"), kind: step.kind, status:"running", detail:step.detail };
        host.m.toolStack.push(call);
        renderChatOnly();
        await sleep(step.runMs ?? 1200);
        if(tok !== playToken) return;
        call.status = "done";
        call.resultSummary = typeof step.resultSummary === "function" ? step.resultSummary() : step.resultSummary;
        renderChatOnly();
        break;
      }
      case "artifact": {
        const ar = { id: mid("a"), kind: step.kind, title: step.title, subtitle: step.subtitle };
        state.convArtifacts[convId] = ar;
        const host = lastAssistant(msgs, false);
        if(host && host.m) host.m.artifactRef = { title: step.title };
        if(state.activeConv === convId){
          state.artifact = ar;
          if(!state.artifactOpen) state.artifactOpen = true;
          render();
        }
        break;
      }
      case "actions": {
        const msgsNow = ensureChat(convId);
        let target = [...msgsNow].reverse().find(m=>m.role==="assistant");
        if(step.text){
          target = { id: mid("m"), role:"assistant", text:"", streaming:true, createdAt:Date.now() };
          msgsNow.push(target);
          await streamInto(tok, target, step.text, 8);
        } else if(target){
          target.streaming = false;
        }
        if(target) target.confirm = { actions: step.actions };
        renderChatOnly();
        break;
      }
    }
  }
  persist();
}
function lastAssistant(msgs, ensure){
  for(let i=msgs.length-1; i>=0; i--){
    if(msgs[i].role==="assistant"){
      const m = msgs[i];
      // find an open assistant "slot": text empty or streaming
      if(!m.confirm && (!m.text || m.streaming)) return { m, i };
    }
  }
  if(ensure){
    const m = { id: mid("m"), role:"assistant", text:"", streaming:true, createdAt:Date.now() };
    msgs.push(m);
    return { m, i:msgs.length-1 };
  }
  return { m:null, i:-1 };
}

function newConversation(scriptId, title){
  const id = mid("conv");
  const conv = { id, title: title || (scriptId ? SCRIPTS[scriptId].title : "New conversation"), preview:"Live", when:"Just now", script:scriptId, pinned:false, custom:true };
  state.conversations.unshift(conv);
  state.customConvs.push(id);
  state.activeConv = id;
  state.artifact = null;
  if(scriptId) state.artifactOpen = true;
  persist();
  if(location.hash !== "#/chat") location.hash = "#/chat"; else render();
  if(scriptId) runScript(scriptId, id).then(()=>persist());
}

/* ==================================================================
   EVENTS — single delegated dispatcher (survives streaming re-renders)
   ================================================================== */
function installEvents(){
  /* single delegated click dispatcher */
  document.addEventListener("click", e=>{
    const q = sel => e.target.closest(sel);
    const t = e.target;
    if(q("#palette-back") && t===q("#palette-back")) return setPalette(false);
    const pal = q("[data-pal]"); if(pal){ palItems[Number(pal.dataset.pal)]?.go(); setPalette(false); return; }

    const heart = q("[data-heart]");
    if(heart){ e.stopPropagation();
      const id = heart.dataset.heart;
      state.shortlist = state.shortlist.includes(id) ? state.shortlist.filter(x=>x!==id) : [...state.shortlist, id];
      persist(); setPanel(); return;
    }
    if(q("#btn-artifact,#btn-artifact-close")){ state.artifactOpen = !state.artifactOpen; render(); return; }
    if(q("#btn-search")) { setPalette(true); return; }
    if(q("#btn-share")){
      const url = location.href.split("#")[0];
      if(navigator.clipboard?.writeText) navigator.clipboard.writeText(url).then(()=>toast("Demo link copied","Send it to anyone — it runs right in the browser.","share"), ()=>toast("Copy from the address bar", url, "share"));
      else toast("Copy from the address bar", url, "share");
      return;
    }
    if(q("#newchat")) { newConversation(null, "New conversation"); return; }
    if(q("#btn-send")) { sendMessage(); return; }
    if(q("#btn-attach")) { toast("Attaching (demo)","In a real build this imports a CMA sheet, doc, or MLS export.","paperclip"); return; }
    if(q("#reset-demo")) { localStorage.removeItem(LS_KEY); toast("Resetting demo…","Seeds restore on reload.","refresh"); setTimeout(()=>location.reload(), 450); return; }

    const sel2 = q("[data-conv]");
    if(sel2){ selectConversation(sel2.dataset.conv); return; }

    const starter = q("[data-starter]");
    if(starter){ const s = STARTERS.find(x=>x.id===starter.dataset.starter);
      if(s?.route){ location.hash = s.route; if(state.route===s.route) render(); return; }
      if(s?.script){ newConversation(s.script); return; } }

    const taskBtn = q("[data-task],[data-open-task-script]");
    if(taskBtn){ handleTaskClick(taskBtn.dataset.task || taskBtn.dataset.openTaskScript); return; }

    const tool = q("[data-tool]");
    if(tool){
      const id = tool.dataset.tool;
      state.openTool = state.openTool || {};
      state.openTool[id] = !state.openTool[id];
      const holder = tool.parentElement;
      const det = holder.querySelector(".tool-detail");
      tool.classList.toggle("open", !!state.openTool[id]);
      if(det) det.remove();
      else{
        outer: for(const m of (state.chats[state.activeConv]||[])){
          if(!m.toolStack) continue;
          for(const c of m.toolStack){ if(c.id===id){
            const div = document.createElement("div"); div.className="tool-detail";
            div.innerHTML = c.detail || esc((TOOL_KINDS[c.kind]?.label||"tool")+" · "+(TOOL_KINDS[c.kind]?.system||""));
            holder.appendChild(div); break outer;
          } }
        }
      }
      return;
    }
    const cmd = q("[data-cmd]"); if(cmd){ state.compose.value=""; goRoute(cmd.dataset.cmd); return; }
    const conf = q("[data-confirm]");
    if(conf){ const idx = Number(conf.dataset.confirm);
      const msgs = ensureChat(state.activeConv);
      const last = msgs[msgs.length-1];
      if(last?.confirm){ runConfirm(last, last.confirm.actions[idx]); }
      return;
    }
    if(q("[data-open-artifact]")){ state.artifactOpen = true; render(); return; }

    /* artifact panel internals */
    if(q("[data-ltab]")){ state.listingsTab = q("[data-ltab]").dataset.ltab; setPanel(); return; }
    if(q("[data-listing-back]")){ state.openListing = null; setPanel(); return; }
    if(q("[data-listing]")){ state.openListing = q("[data-listing]").dataset.listing; setPanel(); return; }
    if(q("[data-slot]")){ state.chosenSlot = Number(q("[data-slot]").dataset.slot); setPanel(); return; }
    if(q("[data-outreach]")){ state.outreach = q("[data-outreach]").dataset.outreach; setPanel(); return; }
    if(q("[data-doctab]")){ state.docTab = q("[data-doctab]").dataset.doctab; state.docPage = 1; setPanel(); return; }
    if(q("[data-docpage]")){ state.docPage = Math.max(1, (state.docPage||1) + Number(q("[data-docpage]").dataset.docpage)); setPanel(); return; }
    if(q("[data-nlead]")){ state.nurtureLead = LEADS.find(l=>l.id===q("[data-nlead]").dataset.nlead); setPanel(); return; }
    if(q("[data-switch]")){ const sw = q("[data-switch]"); sw.classList.toggle("on"); const k = sw.dataset.switch; state.settings[k] = sw.classList.contains("on"); persist(); return; }

    const actBtn = q("[data-act]");
    if(actBtn){ fireAct(actBtn.dataset.act, actBtn.dataset.listing); return; }
    const apr = q("[data-apr]");
    if(apr){ handleApproval(apr.dataset.apr, apr.dataset.aprId); return; }
  }, true);
  /* inputs */
  document.addEventListener("input", e=>{
    if(e.target.id==="composer"){
      const ta2 = e.target;
      state.compose.value = ta2.value;
      autoGrow(ta2);
      const sb = document.querySelector("#btn-send"); if(sb) sb.disabled = ta2.value.trim()==="";
      updateCmdList();
    }
    if(e.target.id==="convsearch"){
      state.convSearch = e.target.value;
      refreshSidebarPreviewList();
    }
  });
  document.addEventListener("keydown", e=>{
    if(e.target.id==="composer"){
      if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); }
      if(e.key==="Escape"){ state.compose.value=""; render(); focusComposer(); }
    }
    if(e.target.id==="convsearch" && e.key==="Escape"){ state.convSearch=""; render(); }
  });
}
function selectConversation(id){
  state.activeConv = id;
  const conv = state.conversations.find(c=>c.id===id);
  state.artifact = state.convArtifacts[id] || null;
  ensureChat(id);
  if(!(state.chats[id].length) && conv?.script){
    runScript(conv.script, id).then(persist);
  }
  if(location.hash !== "#/chat") location.hash = "#/chat";
  else render();
}
function handleTaskClick(taskId){
  const t = TASKS.find(x=>x.id===taskId);
  if(!t) return;
  if(t.routeScript){ newConversation(t.routeScript); return; }
  if(t.prompt){
    if(location.hash !== "#/chat") location.hash = "#/chat";
    state.compose.value = t.prompt;
    render();
    focusComposer();
  }
}
function focusComposer(){
  const ta2 = document.getElementById("composer");
  if(ta2){ ta2.focus(); ta2.setSelectionRange(ta2.value.length, ta2.value.length); ta2.style.height="auto"; autoGrow(ta2); }
}
function handleApproval(act, id){
  if(act==="edit"){ toast("Editing plans (demo)","Each step becomes an editable prompt in the real build.","pen"); return; }
  state.approvalsState[id] = act==="approve" ? "approved" : "rejected";
  const a = APPROVALS.find(x=>x.id===id);
  persist(); render();
  toast(act==="approve" ? "Approved" : "Rejected",
    act==="approve" ? `“${a.title.slice(0,52)}${a.title.length>52?"…":""}” is now running` : "The agent was told — plan archived",
    act==="approve" ? "check" : "shield-off");
}
function fireAct(a, listingId){
  if(a==="print") toast("Print (demo)","In a real build this hits your printer driver with the exact layout.","printer");
  if(a==="export") toast("Exported (demo)","The CMA ships as a branded PDF in the real build.","download");
  if(a==="mls-sync") toast("Feed refreshed","MLS sync complete · 7 matches · 14 min ago","refresh");
  if(a==="send-shortlist") toast("Short list sent",`Emailed to ${CLIENT.email} · open-tracking on`,"send");
  if(a==="request-showing") toast("Showing requested","Sent to the list agent — I'll propose windows back to you.","calendar");
  if(a==="send-outreach") toast("Sent","Auto-logged to CRM · you stay in control","check");
  if(a==="queue-seq") toast("Sequence queued","Day 0 lands tomorrow, 10:40 AM local · auto-pause on reply","play");
  if(a==="doc-download") toast("Download (demo)","Field-merged DocuSign envelope lives in the real build.","download");
  if(a==="doc-send") toast("Envelope sent","Dana gets SMS + email · signature tracked from here","check");
}
function runConfirm(last, act){
  last.confirm = null;
  const msgs = ensureChat(state.activeConv);
  msgs.push({ id: mid("m"), role:"user", text:"✓ "+act.label, createdAt:Date.now() });
  renderChatOnly(); persist();
  (async ()=>{
    const tok = ++playToken;
    await sleep(350); if(tok!==playToken) return;
    const host = lastAssistant(msgs,true);
    await streamInto(tok, host.m, act.follow, 9);
    persist();
  })();
}
function updateCmdList(){
  const outer = document.querySelector(".composer-outer");
  if(!outer) return;
  const want = state.compose.value.startsWith("/") && !state.compose.value.includes(" ");
  let cl = outer.querySelector(".cmd-list");
  if(want && !cl){
    cl = document.createElement("div"); cl.className="cmd-list";
    cl.innerHTML = SUPPORTED_SCMDS.map(c=>`<button class="cmd-item" data-cmd="${c.route}"><code>${esc(c.label)}</code> ${esc(c.desc)}</button>`).join("");
    outer.insertBefore(cl, outer.firstChild);
  } else if(!want && cl){ cl.remove(); }
}
function refreshSidebarPreviewList(){
  const holder = document.querySelector(".side-scroll");
  if(!holder) return;
  const q = (state.convSearch||"").toLowerCase();
  const convs = state.conversations.filter(c=> !q || c.title.toLowerCase().includes(q) || (c.preview||"").toLowerCase().includes(q));
  const pinned = convs.filter(c=>c.pinned), rest = convs.filter(c=>!c.pinned);
  const today = rest.filter(c=>/Today|Just now/i.test(c.when)), earlier = rest.filter(c=>!/Today|Just now/i.test(c.when));
  const convBtn = (c)=>`
    <button class="conv-item ${state.activeConv===c.id && state.route==="#/chat" ? "active":""}" data-conv="${c.id}">
      <span class="t"><span class="dot" style="${c.preview==="Live"?"":"display:none"}"></span>${esc(c.title)}</span>
      <span class="s">${esc(c.preview||"")}</span>
    </button>`;
  holder.innerHTML =
    (pinned.length?`<div class="side-label">Pinned</div>${pinned.map(convBtn).join("")}`:"")+
    (today.length?`<div class="side-label">Today</div>${today.map(convBtn).join("")}`:"")+
    (earlier.length?`<div class="side-label">Earlier</div>${earlier.map(convBtn).join("")}`:"")||
    `<div style="padding:14px; color:var(--t4); font-size:12px">No conversations match.</div>`;
  if(!pinned.length && !today.length && !earlier.length) holder.innerHTML = `<div style="padding:14px; color:var(--t4); font-size:12px">No conversations match.</div>`;
}
function autoGrow(t){
  t.style.height="auto";
  t.style.height = Math.min(t.scrollHeight, 200)+"px";
}
function sendMessage(){
  const txt = state.compose.value.trim();
  if(!txt) return;
  /* slash commands route immediately, no message bubbles */
  const q0 = txt.toLowerCase();
  const cmdHit = SUPPORTED_SCMDS.find(c=>q0.startsWith(c.label));
  if(cmdHit){ state.compose.value = ""; goRoute(cmdHit.route); return; }
  state.compose.value = "";
  const conv = state.conversations.find(c=>c.id===state.activeConv) || newConversation(null,"New conversation");
  const msgs = ensureChat(state.activeConv);
  msgs.push({ id: mid("m"), role:"user", text: txt, createdAt:Date.now() });
  renderChatOnly(); persist();
  /* NOTE: no playToken bump here — sending must never cancel conversations that
     are running their scripted flows in the background. */
  const tok = playToken;
  (async ()=>{
    await sleep(400);
    /* route special */
    const q = txt.toLowerCase();
    if(q.includes("follow") && (q.includes("today")||q.includes("who"))){ goRoute("#/tasks"); return; }
    if(q.includes("cma")||q.includes("valuation")||q.includes("worth")){ newConversation("cma"); state.compose.value=""; return; }
    if(q.includes("find")||q.includes("homes")||q.includes("listings")||q.includes("4br")){ newConversation("listings"); return; }
    if(q.includes("schedule")||q.includes("book")||q.includes("consult")||q.includes("showing")){ newConversation("schedule"); return; }
    if(q.includes("cold")||q.includes("rewarm")||q.includes("re-warm")||q.includes("stagnant")){ newConversation("rewarm"); return; }
    if(q.includes("agreement")||q.includes("contract")||q.includes("docusign")||q.includes("disclosure")){ newConversation("doc"); return; }
    /* its own fresh assistant bubble, placed after the user question */
    const rep = { id: mid("m"), role:"assistant", text:"", streaming:true, createdAt:Date.now() };
    msgs.push(rep);
    renderChatOnly();
    await streamInto(tok, rep, fallbackReplyQuote(txt), 9);
    persist();
  })();
}
function fallbackReplyQuote(txt2){
  return fallbackReply(txt2);
}
/* ---------- generic assistant reply (plain text, no markdown) ---------- */

  return "I can work any of these from right here:\n\n• Pull a CMA — comps, absorption, and a range you can defend\n• Search MLS — short lists ranked against a buyer's actual brief\n• Schedule — propose windows, send by voice, email, or SMS\n• Re-warm cold leads — draft sequences that pause the moment anyone replies\n• Draft documents — agreements pre-filled and pre-reviewed\n\nYou're connected to "+CONFIG.connections.join(", ")+". What should I pull first?";
}
function goRoute(h){
  if(location.hash === h){ state.route = h; render(); }
  else location.hash = h;
}
function removeEl(el){ el?.remove?.(); }

/* ---------- palette ---------- */
function paletteDefs(){
  const items = [];
  for(const c of state.conversations) items.push({ group:"Conversations", label:c.title, sub:c.when, ic:"chat", go:()=>{ selectConversation(c.id); } });
  for(const t of TASKS.slice(0,6)) items.push({ group:"Tasks", label:t.title, sub:t.due, ic:"list-tasks", go:()=>{ location.hash="#/tasks"; setTimeout(()=>handleTaskClick(t.id), 60); } });
  for(const s of SUPPORTED_SCMDS) items.push({ group:"Pages", label:s.desc, sub:s.label, ic:"zap", go:()=>{ location.hash=s.route; } });
  for(const st of STARTERS) items.push({ group:"Demo flows", label:st.prompt, sub:"run flow", ic:st.icon, go:()=>{ st.route ? location.hash=st.route : newConversation(st.script); } });
  return items;
}
let palSel = 0, palItems = [];
function setPalette(open){
  state.palette = open;
  let back = document.getElementById("palette-back");
  if(open){
    if(back) back.remove();
    back = document.createElement("div"); back.id="palette-back";
    back.innerHTML = `<div id="palette"><input id="pal-input" placeholder="Search conversations, tasks, flows… (${navigator.platform.includes("Mac")?"⌘":"Ctrl"}K)"/><div class="pl-list" id="pal-list"></div></div>`;
    back.onclick = null;
    document.body.appendChild(back);
    const inp = back.querySelector("#pal-input");
    inp.oninput = ()=>{ palSel = 0; drawPalette(inp.value.toLowerCase()); };
    inp.onkeydown = e=>{
      if(e.key==="ArrowDown"){ e.preventDefault(); palSel = Math.min(palSel+1, palItems.length-1); drawPalette(inp.value.toLowerCase()); }
      if(e.key==="ArrowUp"){ e.preventDefault(); palSel = Math.max(palSel-1, 0); drawPalette(inp.value.toLowerCase()); }
      if(e.key==="Enter"){ e.preventDefault(); palItems[palSel]?.go(); setPalette(false); }
      if(e.key==="Escape") setPalette(false);
    };
    drawPalette("");
    inp.focus();
  } else back?.remove();
}
function drawPalette(q){
  const items = paletteDefs().filter(i=> !q || i.label.toLowerCase().includes(q) || i.sub?.toLowerCase().includes(q));
  palItems = items;
  if(!items.length){ document.getElementById("pal-list").innerHTML = `<div style="padding:20px; color:var(--t4); font-size:12.5px">No matches.</div>`; return; }
  let html = ""; let lastG = "";
  items.forEach((i,idx)=>{
    if(i.group!==lastG){ html += `<div class="pl-group">${esc(i.group)}</div>`; lastG = i.group; }
    html += `<button class="pl-item ${idx===palSel?"sel":""}" data-pal="${idx}">${icon(i.ic)} <span style="min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${esc(i.label)}</span><small>${esc(i.sub||"")}</small></button>`;
  });
  const list = document.getElementById("pal-list");
  list.innerHTML = html;
  list.querySelector(".pl-item.sel")?.scrollIntoView({block:"nearest"});
}

/* ---------- keyboard ---------- */
window.addEventListener("keydown", e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); setPalette(state.palette!==true); }
  if(e.key==="Escape" && state.palette) setPalette(false);
});

/* ---------- hash router ---------- */
window.addEventListener("hashchange", ()=>{ state.route = location.hash || "#/chat"; render(); });

/* agents rotation */
setInterval(()=>{ state._agentShift = ((state._agentShift||0)+1)%3; if(location.hash==="#/agents"){ state.route="#/agents"; render(); } }, 6000);

/* ---------- boot ---------- */
(function boot(){
  const hash = location.hash || "#/chat";
  if(!["#/chat","#/tasks","#/approvals","#/agents","#/settings"].includes(hash)) location.hash = "#/chat";
  state.route = location.hash || "#/chat";
  state.todayLabel = new Date().toLocaleDateString(undefined, {month:"long", year:"numeric"});
  installEvents();
  if(state.route==="#/chat"){
    const conv = state.conversations.find(c=>c.id===state.activeConv);
    if(!state.chats[state.activeConv]?.length && conv?.script){ runScript(conv.script, state.activeConv); }
  }
  render();
})();
</script>
